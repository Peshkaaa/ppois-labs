name: lab2

on:
  pull_request:
    paths: ["lab2/**", ".github/workflows/lab2.yml"]
  push:
    branches: [main]
    tags: ["lab2-v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab2
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake cppcheck
          pip install gcovr
      - name: Configure (with coverage)
        run: cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug -DHOTEL_COVERAGE=ON
      - name: Build
        run: cmake --build build-cov -j
      - name: Run unit tests
        run: ctest --test-dir build-cov --output-on-failure
      - name: Check coverage (> 90%)
        run: gcovr -r . --filter 'src/' --filter 'cli/' --object-directory build-cov --fail-under-line 91 --print-summary
      - name: Static analysis (cppcheck)
        run: >
          cppcheck --std=c++20 --enable=warning,style,performance,portability
          --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem
          --suppress=unusedFunction --suppress=useStlAlgorithm -Iinclude -Icli src cli app

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/lab2-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab2
    steps:
      - uses: actions/checkout@v4
      - name: Build release artifact
        run: |
          sudo apt-get update && sudo apt-get install -y cmake
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release -j
          tar -czf hotel_cli-linux-x86_64.tar.gz -C build-release hotel_cli
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          files: lab2/hotel_cli-linux-x86_64.tar.gz
